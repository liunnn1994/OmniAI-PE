//设置分辨率
TEAM DISP W1024 H768 B32|DISP W1152 H864 B32|DISP W1280 H720 B32

//DPI自适配
LOAD "%ProgramFiles%\PETools\AutoDPI.WCS"



//PECMD托盘菜单,移动硬盘的即插即用(自动分配盘符)
INIT U

//关闭小键盘
NUMK 0

// 加载驱动
LOAD "%ProgramFiles%\Drives\SRS.WCS"
EXEC !Drvload.exe %SystemRoot%\inf\usbstor.inf
EXEC =!"%ProgramFiles%\PETools\vtoydump.exe" -m

// 挂载隐藏分区
SHOW -check -1:-1

// 理顺盘符
DISK -check -from:C-V ,,,1,?:,0x71

// 禁用回收站
RECY *:\,0

// 开启数字验证
REGI HKLM\SYSTEM\Setup\SystemSetupInProgress=#0

EXEC =@wpeinit.exe

// 加载声音
DEVI %SystemRoot%\inf\hdaudio.inf
SERV Audiosrv

// 网络
EXEC =!netcfg.exe -c s -i MS_NATIVEWIFIP
EXEC !wpeutil.exe InitializeNetwork
EXEC !wpeutil.exe DisableFirewall
SERV MSiSCSI
SERV netprofm
SERV WebClient
SERV Winmgmt
SERV Wlansvc

// 输入法
EXEC Ctfmon.exe

SERV W32Time

// 关闭数字验证
REGI HKLM\SYSTEM\Setup\SystemSetupInProgress=#1

// 计算机名
REGI --init .HKLM\SYSTEM\ControlSet001\Control\ComputerName\ComputerName\ComputerName,&ComputerName
REGI $HKLM\SYSTEM\ControlSet001\Services\Tcpip\Parameters\Hostname=%&ComputerName%
REGI $HKLM\SYSTEM\ControlSet001\Services\Tcpip\Parameters\NV Hostname=%&ComputerName%

EXEC !cmd /c "MKLINK "%WinDir%\System32\7z.exe" "%ProgramFiles%\7-zip\7z.exe""
EXEC !cmd /c "MKLINK "%WinDir%\System32\7z.dll" "%ProgramFiles%\7-zip\7z.dll""

EXEC -hide powercfg /X /disk-timeout-ac 0
EXEC -hide powercfg /X /disk-timeout-dc 0
EXEC !=net share Users /delete /y
EXEC !=net share Users=X:\Users /grant:everyone,full /unlimited
EXEC !=icacls X:\Users /grant everyone:(OI)(CI)F /t /c /q

CALL $gdi32.dll,EnableEUDC

//注册WinXShell
EXEC "%ProgramFiles%\WinXShell\WinXShell.exe" -regist -daemon

EXEC !"%ProgramFiles%\PETools\ShellFix\ShellF5.exe"
EXEC !"%ProgramFiles%\PETools\ShellFix\ShellR32.exe"

//加载外置软件工具
FORX !\OmniAIPE\OmniAIPE.INI,MyIni,1,LOAD %MyIni%

//加载工具
LOAD "%ProgramFiles%\PETools.ini"