
//加载网卡驱动
EXEC PECMD LOAD "%ProgramFiles%\Drives\Network.WCS"

//VMwareTools
EXEC !"%CurDir%\PETools\VMTools.exe"

//文件关联
EXEC "%CurDir%\Imagine\Imagine64.exe" /regcontextmenu /regiser /assocext

//注册表
EXEC !REG IMPORT "%CurDir%\7-Zip\7z.reg"

//输入法
LOAD "%CurDir%\SogouInput\Initialize.ini"

//HPM支持
EXEC PECMD LOAD "%ProgramFiles%\HPM\HPM.WCS"

//Edgeless支持
EXEC PECMD LOAD "%CurDir%\Edgeless\Edgeless.WCS"

// 注册软件热键 
HOTK ALT + M,%CurDir%\PETools\mouse.exe
HOTK Ctrl + Alt + A,%CurDir%\PETools\ScreenCapture.exe
HOTK Alt + A,%CurDir%\PETools\ScreenCapture.exe
HOTK VK_SNAPSHOT,%CurDir%\PETools\ScreenCapture.exe
HOTK Alt + D,%CurDir%\PETools\WinosInfo.exe

//创建桌面快捷方式
LINK %Desktop%\远控协助,%CurDir%\RDTools\RDTools.exe
LINK %Desktop%\HotSysSetup 系统安装,%CurDir%\HotSysSetup\HotSysSetup.exe
LINK %Desktop%\所有工具,explorer.exe,%Programs%,%CurDir%\Icons\allTools.ico

//创建开始菜单所有程序快捷方式
LINK %Programs%\PE工具\键盘控制鼠标(ALT+M),%CurDir%\PETools\mouse.exe
LINK %Programs%\PE工具\截图工具([Ctrl] + Alt + A，PrtScn),%CurDir%\PETools\ScreenCapture.exe
LINK %Programs%\PE工具\桌面硬件信息显示(Alt + D),%CurDir%\PETools\WinosInfo.exe

LINK %Programs%\PE工具\驱动管理\重新加载SRS驱动,Pecmd.exe,LOAD "%ProgramFiles%\Drives\SRS.WCS",%CurDir%\Drives\DrvIndex.exe
LINK %Programs%\PE工具\驱动管理\重新加载网卡驱动,Pecmd.exe,LOAD "%ProgramFiles%\Drives\Network.WCS",%CurDir%\Drives\DrvIndex.exe
LINK %Programs%\PE工具\驱动管理\加载本地系统驱动,%CurDir%\Drives\DrvIndex.exe,-y
LINK %Programs%\PE工具\驱动管理\加载本地系统驱动(除显卡驱动),%CurDir%\Drives\DrvIndex.exe,-h
LINK %Programs%\PE工具\驱动管理\DrvIndex,%CurDir%\Drives\DrvIndex.exe

LINK %Programs%\系统附件\屏幕键盘,%CurDir%\PETools\KeyBoard.exe
LINK %Programs%\系统附件\计算器,calc.exe
LINK %Programs%\系统附件\注册表编辑器,regedit.exe
LINK %Programs%\系统附件\摄像头,%CurDir%\PETools\D8Ecap.exe
LINK %Programs%\系统附件\控制面板,control.exe
LINK %Programs%\系统附件\蓝牙\添加设备,DevicePairingWizard.exe
LINK %Programs%\系统附件\蓝牙\查看设备,explorer.exe,shell:::{28803F59-3A75-4058-995F-4EE5503B023C},bthudtask.exe
LINK %Programs%\系统附件\蓝牙\文件传送,fsquirt.exe
LINK %Programs%\系统附件\蓝牙\蓝牙设置,control.exe,bthprops.cpl,bthudtask.exe
LINK %Programs%\系统附件\远程桌面,mstsc.exe
LINK %Programs%\系统附件\系统信息,msinfo32.exe
LINK %Programs%\系统附件\画图,mspaint.exe

LINK %Programs%\硬盘工具\磁盘管理,%SystemRoot%\System32\diskmgmt.msc

LINK %Programs%\文件工具\7-ZIP压缩解压,%CurDir%\7-Zip\7zFM.exe
LINK %Programs%\文件工具\Imagine看图工具,%CurDir%\Imagine\Imagine64.exe

LINK %Programs%\网络浏览\iSCSI 发起程序工具,%SystemRoot%\System32\iscsicpl.exe
LINK %Programs%\网络浏览\远控协助,%CurDir%\RDTools\RDTools.exe

LINK %Programs%\备份还原\HotSysSetup 系统安装,%CurDir%\HotSysSetup\HotSysSetup.exe

LINK %Programs%\关于HotPE,About.exe,,%CurDir%\Icons\about.ico

//网络管理
EXEC !"%ProgramFiles%\WinXShell\WinXShell.exe" -luacode "wxsUI('UI_WIFI',nil,' -theme light -hidewindow')"

// 清除壁纸和窗口透明效果，保留开始菜单及工具入口
EXEC =!REG IMPORT "%CurDir%\PETools\PlainAppearance.reg"

//启动桌面
SHEL %SystemRoot%\explorer.exe 

//删除几个不需要的文件
TEAM FILE X:\Users\Public\Desktop\desktop.ini|FILE X:\Users\Default\Desktop\desktop.ini
TEAM FILE %public%\Desktop\desktop.ini|FILE %Desktop%\desktop.ini
TEAM FILE X:\$WIMDESC|FILE X:\$RECYCLE.BIN

//刷新桌面
ENVI @@DeskTopFresh=1

wait 400

//删除几个不需要的文件
TEAM FILE X:\Users\Public\Desktop\desktop.ini|FILE X:\Users\Default\Desktop\desktop.ini
TEAM FILE %public%\Desktop\desktop.ini|FILE %Desktop%\desktop.ini
TEAM FILE X:\$WIMDESC|FILE X:\$RECYCLE.BIN
TEAM FILE %Programs%\Administrative Tools|FILE %Programs%\Startup|FILE %Programs%\desktop.ini

ENVI @@DeskTopFresh=2

//刷新桌面，统一桌面图标位置
wait 5000
ENVI @@DeskTopFresh=1

